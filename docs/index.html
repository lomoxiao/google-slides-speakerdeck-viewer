<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Slide Library - Google Slides Viewer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-build="github-pages-api-mvp-20260509">
  <main class="app">
    <section id="galleryView" class="gallery-view is-visible" aria-labelledby="galleryTitle">
      <div class="shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Google Slides Viewer</p>
            <h1 id="galleryTitle">Slide Library</h1>
            <p class="subtitle">Drive 上の Google Slides を探して読みやすく表示するビューアです。</p>
          </div>
          <button
            id="generationToggle"
            class="ghost-button generation-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="generationPanel"
          >スライド生成</button>
        </header>

        <div id="generationSheetBackdrop" class="sheet-backdrop" hidden></div>
        <form id="generationPanel" class="generation-panel" novalidate hidden>
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="generation-head">
            <div>
              <h2>スライド生成</h2>
              <p>URLまたは調査プロンプトから、Google Slides生成ジョブを依頼します。</p>
            </div>
            <div class="mode-tabs" role="tablist" aria-label="生成モード">
              <button id="urlModeButton" class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="url">URLから生成</button>
              <button id="researchModeButton" class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="research">リサーチから生成</button>
            </div>
            <button id="generationCloseButton" class="icon-button sheet-close" type="button" aria-label="閉じる">×</button>
          </div>

          <div id="urlFields" class="field-grid">
            <label class="field-box" for="urlInput1">
              <span>URL 1</span>
              <input id="urlInput1" type="url" placeholder="https://example.com/article" autocomplete="url">
            </label>
            <label class="field-box" for="urlInput2">
              <span>URL 2</span>
              <input id="urlInput2" type="url" placeholder="任意: https://example.com/report" autocomplete="off">
            </label>
            <label class="field-box" for="urlInput3">
              <span>URL 3</span>
              <input id="urlInput3" type="url" placeholder="任意: https://example.com/source" autocomplete="off">
            </label>
          </div>

          <div id="researchFields" class="field-grid" hidden>
            <label class="field-box is-textarea" for="researchPromptInput">
              <span>調査プロンプト</span>
              <textarea id="researchPromptInput" rows="4" placeholder="例: 生成AIエージェント市場の最新動向を調査し、日本企業への影響を中心に整理してください。"></textarea>
            </label>
          </div>

          <details id="generationDetails" class="generation-details" open>
            <summary>詳細設定</summary>
            <div class="option-grid">
            <label class="field-box" for="audienceInput">
              <span>対象読者</span>
              <input id="audienceInput" type="text" placeholder="例: 経営層、開発者、営業向け" autocomplete="off">
            </label>
            <label class="field-box" for="pagesInput">
              <span>目標スライド数</span>
              <input id="pagesInput" type="number" min="1" step="1" inputmode="numeric" placeholder="例: 8">
            </label>
            <label class="field-box option-focus" for="focusInput">
              <span>重点テーマ</span>
              <input id="focusInput" type="text" placeholder="例: 日本市場への影響を中心に" autocomplete="off">
            </label>
            </div>
          </details>

          <div class="manga-option">
            <label class="manga-toggle" for="mangaToggle">
              <input id="mangaToggle" type="checkbox">
              <span>漫画も生成する（NotebookLM 用ネームを作成）</span>
            </label>
            <label class="field-box manga-style" id="mangaArtStyleField" for="mangaArtStyleSelect" hidden>
              <span>漫画の画風</span>
              <select id="mangaArtStyleSelect">
                <option value="A">A 王道少年漫画</option>
                <option value="B">B 少女漫画</option>
                <option value="C">C 4コマギャグ</option>
                <option value="D">D 青年劇画</option>
                <option value="E">E アメコミ</option>
                <option value="F" selected>F 絵本風</option>
                <option value="G">G レトロ昭和漫画</option>
              </select>
            </label>
            <p class="manga-note">※ 漫画生成は「URLから生成」時のみ。スライドとは別に依頼され、完了はSlackへ個別通知されます。</p>
          </div>

          <div class="generation-actions">
            <button id="generationButton" class="primary-button" type="submit">生成を依頼</button>
          </div>
          <p id="generationMessage" class="form-message" aria-live="polite"></p>
        </form>

        <div id="searchSheetBackdrop" class="sheet-backdrop search-backdrop" hidden></div>
        <div id="searchPanel" class="search-panel">
          <div class="search-sheet-head">
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="search-title-row">
              <h2>検索</h2>
              <button id="searchCloseButton" class="icon-button" type="button" aria-label="検索を閉じる">×</button>
            </div>
          </div>
          <button id="searchToggle" class="ghost-button search-toggle" type="button" aria-expanded="false" aria-controls="searchInput">検索</button>
          <label class="search-box" for="searchInput">
            <span aria-hidden="true">検索</span>
            <input id="searchInput" type="search" placeholder="タイトルで検索" autocomplete="off">
          </label>
          <button id="refreshButton" class="ghost-button refresh-button" type="button">↻ 最新化</button>
          <button id="searchClearButton" class="ghost-button search-clear" type="button">クリア</button>
          <p id="galleryPageIndicator" class="gallery-page-indicator"></p>
        </div>

        <div id="loadingState" class="status is-visible" role="status" aria-live="polite">
          <div>
            <div class="loader" aria-hidden="true"></div>
            <strong>スライドを読み込んでいます</strong>
            <span>Google Slidesライブラリを準備しています。</span>
          </div>
        </div>

        <div id="errorState" class="status" role="alert"></div>
        <div id="emptyState" class="status"></div>
        <div id="generationStatusPanel" class="generation-status-panel" aria-live="polite" hidden></div>
        <div id="gallery" class="gallery" aria-live="polite"></div>
        <nav id="galleryPager" class="gallery-pager" aria-label="スライド一覧ページ送り" hidden>
          <button id="galleryPrevButton" class="ghost-button" type="button">前へ</button>
          <span id="galleryPagerText"></span>
          <button id="galleryNextButton" class="ghost-button" type="button">次へ</button>
        </nav>
        <nav class="mobile-bottom-bar" aria-label="モバイル操作">
          <button id="mobileLibraryButton" class="is-active" type="button">ライブラリ</button>
          <button id="mobileRefreshButton" type="button">最新化</button>
          <button id="mobileSearchButton" type="button">検索</button>
          <button id="mobileCreateButton" type="button">作成</button>
        </nav>
      </div>
    </section>

    <section id="viewerView" class="viewer" aria-labelledby="viewerTitle">
      <div class="shell">
        <header class="viewer-head">
          <button class="ghost-button" type="button" onclick="showGallery()">戻る</button>
          <div class="viewer-title">
            <h2 id="viewerTitle"></h2>
            <p id="pageIndicator"></p>
            <p id="sourceLink" class="source-link"></p>
          </div>
          <button id="fullscreenButton" class="ghost-button" type="button" onclick="toggleViewerFullscreen()">&#20840;&#30011;&#38754;</button>
        </header>

        <div class="viewer-grid">
          <div class="stage-wrap">
            <div class="stage">
              <button id="prevButton" class="nav-button" type="button" onclick="prevPage()" aria-label="Previous page">&lsaquo;</button>
              <div id="slideFrame" class="slide-frame"></div>
              <button id="nextButton" class="nav-button" type="button" onclick="nextPage()" aria-label="Next page">&rsaquo;</button>
            </div>
            <div id="pageStrip" class="page-strip" aria-label="ページサムネイル一覧"></div>
          </div>

          <aside class="viewer-side" aria-label="Speaker notes">
            <h3>Speaker Notes</h3>
            <div id="speakerNoteContent" class="note-content"></div>
          </aside>
        </div>
        <div id="noteSheetBackdrop" class="sheet-backdrop note-backdrop" hidden></div>
        <section id="mobileNoteSheet" class="mobile-note-sheet" aria-label="スピーカーノート" hidden>
          <div class="sheet-handle" aria-hidden="true"></div>
          <div class="mobile-note-head">
            <h3>Speaker Notes</h3>
            <button id="noteSheetCloseButton" class="icon-button" type="button" aria-label="ノートを閉じる">×</button>
          </div>
          <div id="mobileNoteContent" class="note-content"></div>
        </section>
        <nav class="mobile-viewer-bar" aria-label="スライド操作">
          <button type="button" onclick="showGallery()">戻る</button>
          <button id="mobileNoteButton" type="button">ノート</button>
          <span id="mobilePageIndicator"></span>
          <button type="button" onclick="toggleViewerFullscreen()">全画面</button>
        </nav>
        <div id="viewerToast" class="viewer-toast" role="status" aria-live="polite" hidden></div>
      </div>
    </section>
  </main>
  <aside id="debugPanel" class="debug-panel" aria-label="Debug information" hidden></aside>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
