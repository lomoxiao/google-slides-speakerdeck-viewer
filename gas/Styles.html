<style>
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-soft: #fafafa;
  --ink: #1f2328;
  --muted: #69707a;
  --muted-light: #8b949e;
  --line: #e6e8eb;
  --line-strong: #d7dbe0;
  --accent: #1f7a5a;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --shadow-card: 0 14px 34px rgba(31, 35, 40, 0.08);
  --shadow-slide: 0 22px 60px rgba(31, 35, 40, 0.16);
  --radius-lg: 8px;
  --radius-md: 8px;
  --radius-sm: 8px;
  --max-width: 1240px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  font-family: var(--font);
  background: linear-gradient(180deg, #fbfbfc 0%, var(--bg) 50%, #f2f3f5 100%);
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

[hidden] {
  display: none !important;
}

img {
  display: block;
  max-width: 100%;
}

.app {
  min-height: 100vh;
  padding: 46px 24px 34px;
}

.shell {
  width: min(100%, var(--max-width));
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}

.generation-toggle {
  flex: 0 0 auto;
  margin-bottom: 4px;
}

.icon-button {
  display: inline-grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
}

.sheet-close,
.sheet-handle {
  display: none;
}

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(17, 17, 17, 0.32);
  backdrop-filter: blur(3px);
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(36px, 6vw, 66px);
  line-height: 0.95;
  letter-spacing: 0;
}

.subtitle {
  max-width: 560px;
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
}

.generation-panel {
  overflow: hidden;
  display: grid;
  gap: 16px;
  margin: 0 0 18px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.04);
  animation: accordionDown 180ms ease-out;
}

.generation-panel[hidden] {
  display: none;
}

@keyframes accordionDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.generation-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: start;
}

.generation-head h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
}

.generation-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.mode-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-soft);
}

.mode-tab {
  min-height: 36px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
}

.mode-tab.is-active {
  background: var(--ink);
  color: #fff;
}

.field-grid,
.option-grid {
  display: grid;
  gap: 12px;
}

.option-grid {
  grid-template-columns: minmax(0, 1fr) minmax(120px, 180px);
}

.option-focus {
  grid-column: 1 / -1;
}

.field-box,
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
}

.field-box.is-textarea {
  align-items: flex-start;
  border-radius: var(--radius-lg);
}

.field-box span,
.search-box span {
  flex: 0 0 auto;
  color: var(--muted-light);
  font-size: 14px;
}

.field-box input,
.field-box textarea,
.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  color: var(--ink);
  background: transparent;
  font-size: 16px;
}

.field-box textarea {
  resize: vertical;
  line-height: 1.6;
}

.generation-actions {
  display: flex;
  justify-content: flex-end;
}

.primary-button {
  min-height: 48px;
  padding: 0 18px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 8px 18px rgba(31, 122, 90, 0.18);
}

.primary-button:disabled {
  opacity: 0.58;
}

.form-message {
  min-height: 18px;
  margin: -2px 4px 0;
  color: var(--muted);
  font-size: 13px;
}

.form-message.is-error {
  color: var(--danger);
}

.search-panel {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0 22px;
  margin-bottom: 8px;
  background: linear-gradient(180deg, rgba(246, 247, 248, 0.96), rgba(246, 247, 248, 0.78));
  backdrop-filter: blur(14px);
}

.search-toggle {
  display: none;
}

.search-box {
  width: min(100%, 560px);
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.05);
}

.gallery-page-indicator {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}

.status {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 260px;
  padding: 42px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.76);
  color: var(--muted);
  text-align: center;
}

.status.is-visible {
  display: flex;
}

.status strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 19px;
}

.loader {
  width: 22px;
  height: 22px;
  margin: 0 auto 16px;
  border: 2px solid var(--line);
  border-top-color: var(--ink);
  border-radius: 999px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.generation-status-panel {
  display: grid;
  gap: 10px;
  margin: 0 0 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.04);
}

.status-panel-head,
.pending-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
}

.status-panel-head strong,
.status-panel-head span {
  display: block;
}

.status-panel-head strong {
  font-size: 14px;
}

.status-panel-head span,
.pending-row p,
.pending-row time {
  color: var(--muted);
  font-size: 12px;
}

.pending-row {
  grid-template-columns: auto minmax(0, 1fr) auto;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface-soft);
}

.pending-row h2 {
  margin: 0 0 4px;
  overflow: hidden;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pending-row p {
  margin: 0;
}

.pending-dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(31, 122, 90, 0.1);
}

.pending-dot.is-slow {
  background: #9a6700;
  box-shadow: 0 0 0 4px rgba(154, 103, 0, 0.12);
}

.skeleton-card {
  pointer-events: none;
}

.skeleton-card .card-thumb,
.skeleton-line {
  background: linear-gradient(90deg, #eceff2 0%, #f7f8f9 50%, #eceff2 100%);
  background-size: 220% 100%;
  animation: shimmer 1.2s ease-in-out infinite;
}

.skeleton-line {
  width: 72%;
  height: 13px;
  margin-top: 10px;
  border-radius: 999px;
}

.skeleton-line.is-title {
  width: 92%;
  height: 17px;
  margin-top: 0;
}

@keyframes shimmer {
  to {
    background-position: -220% 0;
  }
}

.slide-card,
.pending-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 2px 10px rgba(31, 35, 40, 0.03);
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.slide-card:hover,
.slide-card:focus-visible {
  transform: translateY(-5px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-card);
  outline: none;
}

.pending-card {
  border-style: dashed;
}

.slide-card.is-featured,
.pending-card.is-featured {
  grid-column: 1 / -1;
}

.slide-card.is-featured {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.7fr);
  align-items: stretch;
}

.slide-card.is-featured .card-body {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 22px;
}

.slide-card.is-featured .card-title {
  font-size: clamp(22px, 3vw, 34px);
  line-height: 1.25;
  white-space: normal;
}

.card-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #eef0f2;
}

.pending-thumb {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #eef4f1, #f6f0e8);
  color: var(--accent);
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.image-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 120px;
  padding: 20px;
  color: var(--muted-light);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), transparent), #eceff2;
  font-size: 13px;
  text-align: center;
}

.card-body {
  padding: 16px 16px 17px;
}

.card-title {
  margin: 0 0 10px;
  overflow: hidden;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 13px;
}

.source-slot {
  min-height: 0;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

.open-cue {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 4px;
  margin-top: 12px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
}

.open-cue::after {
  content: "→";
}

.mobile-bottom-bar,
.mobile-viewer-bar,
.mobile-note-sheet {
  display: none;
}

.gallery-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 13px;
}

.gallery-pager[hidden] {
  display: none;
}

.viewer,
.gallery-view {
  display: none;
}

.viewer.is-visible,
.gallery-view.is-visible {
  display: block;
}

body.viewer-fullscreen {
  overflow: hidden;
}

body.viewer-fullscreen .app {
  padding: 0;
}

body.viewer-fullscreen .viewer.is-visible {
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  padding: 14px;
  background: var(--bg);
}

body.viewer-fullscreen .viewer .shell {
  width: 100%;
  max-width: none;
}

body.viewer-fullscreen .viewer-head {
  grid-template-columns: auto minmax(0, 1fr) auto;
  margin-bottom: 12px;
}

body.viewer-fullscreen .viewer-title h2 {
  font-size: 18px;
}

body.viewer-fullscreen .viewer-title p {
  margin-top: 3px;
}

body.viewer-fullscreen .viewer-grid {
  grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
  gap: 16px;
  align-items: stretch;
}

body.viewer-fullscreen .stage-wrap {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

body.viewer-fullscreen .stage {
  flex: 1 1 auto;
  min-height: 0;
}

body.viewer-fullscreen .slide-frame {
  box-shadow: none;
}

body.viewer-fullscreen .slide-frame img,
body.viewer-fullscreen .viewer-message {
  max-height: calc(100vh - 148px);
}

body.viewer-fullscreen .page-strip {
  flex: 0 0 auto;
  padding-top: 10px;
}

body.viewer-fullscreen .thumb-button {
  flex-basis: 78px;
}

body.viewer-fullscreen .viewer-side {
  min-height: 0;
  max-height: calc(100vh - 92px);
  overflow-y: auto;
}

body.viewer-fullscreen .note-content {
  font-size: 15px;
  line-height: 1.8;
}

.viewer-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.ghost-button,
.nav-button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(31, 35, 40, 0.04);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.ghost-button {
  padding: 10px 15px;
}

.ghost-button:hover,
.nav-button:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  background: #fff;
}

.viewer-title {
  min-width: 0;
  text-align: center;
}

.viewer-title h2 {
  margin: 0;
  overflow: hidden;
  font-size: clamp(18px, 3vw, 28px);
  line-height: 1.25;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viewer-title p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.source-link {
  min-height: 18px;
}

.source-link:empty {
  display: none;
}

.source-link a {
  color: var(--accent);
  text-decoration: none;
}

.source-link a:hover {
  text-decoration: underline;
}

.viewer-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
  gap: 26px;
  align-items: start;
}

.stage-wrap {
  min-width: 0;
}

.stage {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
}

.nav-button {
  width: 44px;
  height: 44px;
  color: var(--muted);
  font-size: 26px;
  line-height: 1;
}

.nav-button:disabled {
  opacity: 0.4;
  transform: none;
}

.slide-frame {
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  background: #fff;
  box-shadow: var(--shadow-slide);
  touch-action: pan-y;
}

.slide-frame img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #fff;
}

.viewer-message {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 16 / 9;
  min-height: 220px;
  padding: 28px;
  color: var(--muted);
  text-align: center;
}

.viewer-message strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
}

.viewer-message.is-error strong {
  color: var(--danger);
}

.page-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 18px 2px 4px;
  scrollbar-width: thin;
}

.thumb-button {
  flex: 0 0 104px;
  overflow: hidden;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  background: #fff;
  opacity: 0.62;
  transition: opacity 160ms ease, transform 160ms ease, border-color 160ms ease;
}

.thumb-button:hover,
.thumb-button.is-active {
  opacity: 1;
  transform: translateY(-2px);
  border-color: var(--ink);
}

.thumb-button img,
.thumb-button .image-fallback {
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: auto;
  object-fit: cover;
}

.viewer-side {
  min-height: 320px;
  padding: 20px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.68);
}

.viewer-side h3 {
  margin: 0 0 10px;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: 0.02em;
}

.note-content {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.75;
  white-space: pre-wrap;
}

.visually-hidden {
  position: absolute;
  overflow: hidden;
  width: 1px;
  height: 1px;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

@media (max-width: 1100px) {
  .viewer-grid {
    grid-template-columns: 1fr;
  }

  .viewer-side {
    min-height: auto;
  }
}

@media (max-width: 760px) {
  .app {
    padding: 14px 14px calc(76px + env(safe-area-inset-bottom, 0px));
  }

  .topbar,
  .viewer-head {
    display: flex;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 12;
    align-items: center;
    margin: -2px -4px 12px;
    padding: 8px 4px;
    background: rgba(246, 247, 248, 0.88);
    backdrop-filter: blur(14px);
  }

  .eyebrow,
  .subtitle {
    display: none;
  }

  h1 {
    font-size: 22px;
    line-height: 1.1;
  }

  .generation-toggle {
    display: none;
  }

  .generation-head,
  .option-grid,
  .slide-card.is-featured {
    grid-template-columns: 1fr;
  }

  .generation-head {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .generation-head .mode-tabs {
    grid-column: 1 / -1;
  }

  .mode-tabs {
    width: 100%;
  }

  .mode-tab {
    flex: 1 1 0;
    padding-inline: 8px;
  }

  .primary-button {
    width: 100%;
    margin-top: 10px;
  }

  .sheet-handle {
    display: block;
    width: 42px;
    height: 5px;
    margin: 0 auto 12px;
    border-radius: 999px;
    background: var(--line-strong);
  }

  .sheet-close {
    display: inline-grid;
  }

  .generation-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 80;
    max-height: min(88vh, 720px);
    overflow-y: auto;
    margin: 0;
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    border-radius: 18px 18px 0 0;
    animation: sheetUp 200ms ease-out;
  }

  @keyframes sheetUp {
    from {
      transform: translateY(24px);
      opacity: 0;
    }

    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .viewer-title {
    margin: 18px 0 14px;
    text-align: left;
  }

  .viewer-title h2 {
    white-space: normal;
  }

  .gallery {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .slide-card,
  .pending-card,
  .slide-card.is-featured {
    display: grid;
    grid-template-columns: 118px minmax(0, 1fr);
    min-height: 92px;
  }

  .slide-card.is-featured .card-body {
    padding: 13px 14px;
  }

  .slide-card.is-featured .card-title,
  .card-title {
    display: -webkit-box;
    margin-bottom: 8px;
    font-size: 15px;
    line-height: 1.35;
    white-space: normal;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .card-thumb {
    height: 100%;
    min-height: 92px;
    aspect-ratio: auto;
  }

  .card-body {
    padding: 13px 14px;
  }

  .meta {
    justify-content: flex-start;
    gap: 10px;
  }

  .open-cue {
    margin-top: 8px;
  }

  .search-panel {
    position: static;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 10px;
