<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Slide Library - Google Slides Viewer</title>
  <style>
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-soft: #fafafa;
  --ink: #1f2328;
  --muted: #69707a;
  --muted-light: #8b949e;
  --line: #e6e8eb;
  --line-strong: #d7dbe0;
  --accent: #1f7a5a;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --shadow-card: 0 14px 34px rgba(31, 35, 40, 0.08);
  --shadow-slide: 0 22px 60px rgba(31, 35, 40, 0.16);
  --radius-lg: 8px;
  --radius-md: 8px;
  --radius-sm: 8px;
  --max-width: 1240px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  min-height: 100%;
  margin: 0;
  color: var(--ink);
  font-family: var(--font);
  background: linear-gradient(180deg, #fbfbfc 0%, var(--bg) 50%, #f2f3f5 100%);
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

img {
  display: block;
  max-width: 100%;
}

.app {
  min-height: 100vh;
  padding: 46px 24px 34px;
}

.shell {
  width: min(100%, var(--max-width));
  margin: 0 auto;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}

.generation-toggle {
  flex: 0 0 auto;
  margin-bottom: 4px;
}

.eyebrow {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(36px, 6vw, 66px);
  line-height: 0.95;
  letter-spacing: 0;
}

.subtitle {
  max-width: 560px;
  margin: 16px 0 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
}

.generation-panel {
  overflow: hidden;
  display: grid;
  gap: 16px;
  margin: 0 0 18px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.86);
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.04);
  animation: accordionDown 180ms ease-out;
}

.generation-panel[hidden] {
  display: none;
}

@keyframes accordionDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.generation-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: start;
}

.generation-head h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
}

.generation-head p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.mode-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-soft);
}

.mode-tab {
  min-height: 36px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
}

.mode-tab.is-active {
  background: var(--ink);
  color: #fff;
}

.field-grid,
.option-grid {
  display: grid;
  gap: 12px;
}

.option-grid {
  grid-template-columns: minmax(0, 1fr) minmax(120px, 180px);
}

.option-focus {
  grid-column: 1 / -1;
}

.field-box,
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
}

.field-box.is-textarea {
  align-items: flex-start;
  border-radius: var(--radius-lg);
}

.field-box span,
.search-box span {
  flex: 0 0 auto;
  color: var(--muted-light);
  font-size: 14px;
}

.field-box input,
.field-box textarea,
.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: none;
  color: var(--ink);
  background: transparent;
  font-size: 16px;
}

.field-box textarea {
  resize: vertical;
  line-height: 1.6;
}

.generation-actions {
  display: flex;
  justify-content: flex-end;
}

.primary-button {
  min-height: 48px;
  padding: 0 18px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 8px 18px rgba(31, 122, 90, 0.18);
}

.primary-button:disabled {
  opacity: 0.58;
}

.form-message {
  min-height: 18px;
  margin: -2px 4px 0;
  color: var(--muted);
  font-size: 13px;
}

.form-message.is-error {
  color: var(--danger);
}

.search-panel {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0 22px;
  margin-bottom: 8px;
  background: linear-gradient(180deg, rgba(246, 247, 248, 0.96), rgba(246, 247, 248, 0.78));
  backdrop-filter: blur(14px);
}

.search-box {
  width: min(100%, 560px);
  box-shadow: 0 8px 24px rgba(31, 35, 40, 0.05);
}

.gallery-page-indicator {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}

.status {
  display: none;
  align-items: center;
  justify-content: center;
  min-height: 260px;
  padding: 42px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.76);
  color: var(--muted);
  text-align: center;
}

.status.is-visible {
  display: flex;
}

.status strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 19px;
}

.loader {
  width: 22px;
  height: 22px;
  margin: 0 auto 16px;
  border: 2px solid var(--line);
  border-top-color: var(--ink);
  border-radius: 999px;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.slide-card,
.pending-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: 0 2px 10px rgba(31, 35, 40, 0.03);
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.slide-card:hover,
.slide-card:focus-visible {
  transform: translateY(-5px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-card);
  outline: none;
}

.pending-card {
  border-style: dashed;
}

.slide-card.is-featured,
.pending-card.is-featured {
  grid-column: 1 / -1;
}

.slide-card.is-featured {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.7fr);
  align-items: stretch;
}

.slide-card.is-featured .card-body {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 22px;
}

.slide-card.is-featured .card-title {
  font-size: clamp(22px, 3vw, 34px);
  line-height: 1.25;
  white-space: normal;
}

.card-thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #eef0f2;
}

.pending-thumb {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #eef4f1, #f6f0e8);
  color: var(--accent);
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.image-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 120px;
  padding: 20px;
  color: var(--muted-light);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.7), transparent), #eceff2;
  font-size: 13px;
  text-align: center;
}

.card-body {
  padding: 16px 16px 17px;
}

.card-title {
  margin: 0 0 10px;
  overflow: hidden;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-size: 13px;
}

.gallery-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 22px;
  color: var(--muted);
  font-size: 13px;
}

.gallery-pager[hidden] {
  display: none;
}

.viewer,
.gallery-view {
  display: none;
}

.viewer.is-visible,
.gallery-view.is-visible {
  display: block;
}

body.viewer-fullscreen {
  overflow: hidden;
}

body.viewer-fullscreen .app {
  padding: 0;
}

body.viewer-fullscreen .viewer.is-visible {
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  padding: 14px;
  background: var(--bg);
}

body.viewer-fullscreen .viewer .shell {
  width: 100%;
  max-width: none;
}

body.viewer-fullscreen .viewer-head {
  grid-template-columns: auto minmax(0, 1fr) auto;
  margin-bottom: 12px;
}

body.viewer-fullscreen .viewer-title h2 {
  font-size: 18px;
}

body.viewer-fullscreen .viewer-title p {
  margin-top: 3px;
}

body.viewer-fullscreen .viewer-grid {
  grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
  gap: 16px;
  align-items: stretch;
}

body.viewer-fullscreen .stage-wrap {
  display: flex;
  min-height: 0;
  flex-direction: column;
}

body.viewer-fullscreen .stage {
  flex: 1 1 auto;
  min-height: 0;
}

body.viewer-fullscreen .slide-frame {
  box-shadow: none;
}

body.viewer-fullscreen .slide-frame img,
body.viewer-fullscreen .viewer-message {
  max-height: calc(100vh - 148px);
}

body.viewer-fullscreen .page-strip {
  flex: 0 0 auto;
  padding-top: 10px;
}

body.viewer-fullscreen .thumb-button {
  flex-basis: 78px;
}

body.viewer-fullscreen .viewer-side {
  min-height: 0;
  max-height: calc(100vh - 92px);
  overflow-y: auto;
}

body.viewer-fullscreen .note-content {
  font-size: 15px;
  line-height: 1.8;
}

.viewer-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.ghost-button,
.nav-button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.82);
  color: var(--ink);
  box-shadow: 0 6px 18px rgba(31, 35, 40, 0.04);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

.ghost-button {
  padding: 10px 15px;
}

.ghost-button:hover,
.nav-button:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  background: #fff;
}

.viewer-title {
  min-width: 0;
  text-align: center;
}

.viewer-title h2 {
  margin: 0;
  overflow: hidden;
  font-size: clamp(18px, 3vw, 28px);
  line-height: 1.25;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viewer-title p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.source-link {
  min-height: 18px;
}

.source-link:empty {
  display: none;
}

.source-link a {
  color: var(--accent);
  text-decoration: none;
}

.source-link a:hover {
  text-decoration: underline;
}

.viewer-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 300px);
  gap: 26px;
  align-items: start;
}

.stage-wrap {
  min-width: 0;
}

.stage {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
}

.nav-button {
  width: 44px;
  height: 44px;
  color: var(--muted);
  font-size: 26px;
  line-height: 1;
}

.nav-button:disabled {
  opacity: 0.4;
  transform: none;
}

.slide-frame {
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-md);
  background: #fff;
  box-shadow: var(--shadow-slide);
  touch-action: pan-y;
}

.slide-frame img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #fff;
}

.viewer-message {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 16 / 9;
  min-height: 220px;
  padding: 28px;
  color: var(--muted);
  text-align: center;
}

.viewer-message strong {
  display: block;
  margin-bottom: 8px;
  color: var(--ink);
}

.viewer-message.is-error strong {
  color: var(--danger);
}

.page-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 18px 2px 4px;
  scrollbar-width: thin;
}

.thumb-button {
  flex: 0 0 104px;
  overflow: hidden;
  padding: 0;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  background: #fff;
  opacity: 0.62;
  transition: opacity 160ms ease, transform 160ms ease, border-color 160ms ease;
}

.thumb-button:hover,
.thumb-button.is-active {
  opacity: 1;
  transform: translateY(-2px);
  border-color: var(--ink);
}

.thumb-button img,
.thumb-button .image-fallback {
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: auto;
  object-fit: cover;
}

.viewer-side {
  min-height: 320px;
  padding: 20px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  background: rgba(255, 255, 255, 0.68);
}

.viewer-side h3 {
  margin: 0 0 10px;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: 0.02em;
}

.note-content {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.75;
  white-space: pre-wrap;
}

.visually-hidden {
  position: absolute;
  overflow: hidden;
  width: 1px;
  height: 1px;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

@media (max-width: 1100px) {
  .viewer-grid {
    grid-template-columns: 1fr;
  }

  .viewer-side {
    min-height: auto;
  }
}

@media (max-width: 760px) {
  .app {
    padding: 28px 16px;
  }

  .topbar,
  .viewer-head {
    display: block;
  }

  .generation-toggle {
    width: 100%;
    margin-top: 18px;
  }

  .generation-head,
  .option-grid,
  .slide-card.is-featured {
    grid-template-columns: 1fr;
  }

  .mode-tabs {
    width: 100%;
  }

  .mode-tab {
    flex: 1 1 0;
    padding-inline: 8px;
  }

  .primary-button {
    width: 100%;
    margin-top: 10px;
  }

  .viewer-title {
    margin: 18px 0 14px;
    text-align: left;
  }

  .viewer-title h2 {
    white-space: normal;
  }

  .gallery {
    grid-template-columns: 1fr;
  }

  .search-panel {
    position: static;
    display: block;
    padding-top: 6px;
  }

  .gallery-page-indicator {
    margin-top: 10px;
  }

  .stage {
    grid-template-columns: 1fr;
  }

  .nav-button {
    display: none;
  }

  .thumb-button {
    flex-basis: 86px;
  }
}

@media (max-width: 932px) {
  .gallery {
    grid-template-columns: 1fr;
  }

  .slide-card.is-featured,
  .pending-card.is-featured {
    grid-column: auto;
  }
}

@media (hover: none) and (pointer: coarse) and (max-width: 1180px) {
  .gallery {
    grid-template-columns: 1fr;
  }

  body:has(.viewer.is-visible) {
    overflow: hidden;
  }

  .viewer.is-visible {
    position: fixed;
    inset: 0;
    z-index: 50;
    overflow: hidden;
    padding: 8px;
    background: var(--bg);
  }

  .viewer.is-visible .shell {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  body.viewer-fullscreen .viewer-head,
  .viewer.is-visible .viewer-head {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: 8px;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 0;
    pointer-events: none;
  }

  body.viewer-fullscreen .viewer-title,
  .viewer.is-visible .viewer-title {
    display: none;
  }

  .viewer.is-visible .ghost-button {
    padding: 8px 10px;
    border-color: rgba(215, 219, 224, 0.75);
    background: rgba(255, 255, 255, 0.74);
    font-size: 12px;
    box-shadow: 0 4px 14px rgba(31, 35, 40, 0.1);
    pointer-events: auto;
  }

  body.viewer-fullscreen .viewer-grid,
  .viewer.is-visible .viewer-grid {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 58%) minmax(0, 42%);
    flex: 1 1 auto;
    min-height: 0;
    gap: 8px;
  }

  .viewer.is-visible .stage-wrap {
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  body.viewer-fullscreen .stage,
  .viewer.is-visible .stage {
    grid-template-columns: 1fr;
    min-height: 0;
    flex: 1 1 auto;
  }

  body.viewer-fullscreen .nav-button,
  .viewer.is-visible .nav-button {
    display: none;
  }

  body.viewer-fullscreen .slide-frame,
  .viewer.is-visible .slide-frame {
    height: 100%;
    border-radius: 0;
    box-shadow: none;
  }

  body.viewer-fullscreen .slide-frame img,
  body.viewer-fullscreen .viewer-message,
  .viewer.is-visible .slide-frame img,
  .viewer.is-visible .viewer-message {
    width: 100%;
    height: 100%;
    max-height: none;
    object-fit: contain;
  }

  .viewer.is-visible .page-strip {
    display: none;
  }

  body.viewer-fullscreen .viewer-side,
  .viewer.is-visible .viewer-side {
    min-height: 0;
    max-height: none;
    overflow-y: auto;
    padding: 12px 12px 42px;
  }

  .viewer.is-visible .viewer-side h3 {
    margin-bottom: 6px;
  }

  body.viewer-fullscreen .note-content,
  .viewer.is-visible .note-content {
    font-size: 13px;
    line-height: 1.65;
  }
}

@media (hover: none) and (pointer: coarse) and (max-width: 1180px) and (orientation: landscape) {
  body.viewer-fullscreen .viewer-grid,
  .viewer.is-visible .viewer-grid {
    grid-template-columns: minmax(0, 62%) minmax(0, 38%);
    grid-template-rows: 1fr;
  }

  body.viewer-fullscreen .viewer-side,
  .viewer.is-visible .viewer-side {
    padding-bottom: 42px;
  }
}

.viewer-toast {
  position: fixed;
  left: 50%;
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  max-width: min(92vw, 520px);
  padding: 10px 14px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: rgba(17, 17, 17, 0.84);
  color: #fff;
  font-size: 13px;
  line-height: 1.45;
  text-align: center;
  transform: translateX(-50%);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(12px);
}

.viewer-toast[hidden] {
  display: none;
}

body.viewer-immersive {
  overflow: hidden;
  background: #111;
}

body.viewer-immersive .app {
  min-height: var(--viewer-height, 100dvh);
  padding: 0;
}

body.viewer-immersive .gallery-view {
  display: none;
}

body.viewer-immersive .viewer.is-visible {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: block;
  overflow: hidden;
  width: 100vw;
  height: var(--viewer-height, 100dvh);
  padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px));
  background: #111;
  color: #fff;
}

body.viewer-immersive .viewer .shell {
  display: flex;

  z-index: 75;
  display: flex;

body.viewer-immersive .ghost-button,

  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);

  bottom: calc(10px + env(safe-area-inset-bottom, 0px));

  width: 44px;
  height: 44px;
  font-size: 24px;

body.viewer-immersive #prevButton {

  transform: translateY(8px);
}

  transform: translate(-58px, 8px);
}

body.viewer-controls-idle.viewer-immersive #nextButton {

}

body.viewer-fullscreen-unavailable.viewer-immersive .viewer.is-visible {

}

@media (hover: none) and (pointer: coarse) and (max-width: 1180px) and (orientation: landscape) {
  body.viewer-immersive .viewer-grid {
    grid-template-columns: minmax(0, 64%) minmax(0, 36%);
    grid-template-rows: 1fr;

    grid-template-rows: minmax(0, 48%) minmax(0, 52%);
  }
}

</head>
<body>
  <main class="app">
    <section id="galleryView" class="gallery-view is-visible" aria-labelledby="galleryTitle">
      <div class="shell">
        <header class="topbar">
          <div>
            <p class="eyebrow">Google Slides Viewer</p>
            <h1 id="galleryTitle">Slide Library</h1>
            <p class="subtitle">Drive 上の Google Slides を探して読みやすく表示するビューアです。</p>
          </div>
          <button
            id="generationToggle"
            class="ghost-button generation-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="generationPanel"
          >スライド生成</button>
        </header>

        <form id="generationPanel" class="generation-panel" novalidate hidden>
          <div class="generation-head">
            <div>
              <h2>スライド生成</h2>
              <p>URLまたは調査プロンプトから、Google Slides生成ジョブを依頼します。</p>
            </div>
            <div class="mode-tabs" role="tablist" aria-label="生成モード">
              <button id="urlModeButton" class="mode-tab is-active" type="button" role="tab" aria-selected="true" data-mode="url">URLから生成</button>
              <button id="researchModeButton" class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="research">リサーチから生成</button>
            </div>
          </div>

          <div id="urlFields" class="field-grid">
            <label class="field-box" for="urlInput1">
              <span>URL 1</span>
              <input id="urlInput1" type="url" placeholder="https://example.com/article" autocomplete="url">
            </label>
            <label class="field-box" for="urlInput2">
              <span>URL 2</span>
              <input id="urlInput2" type="url" placeholder="任意: https://example.com/report" autocomplete="off">
            </label>
            <label class="field-box" for="urlInput3">
              <span>URL 3</span>
              <input id="urlInput3" type="url" placeholder="任意: https://example.com/source" autocomplete="off">
            </label>
          </div>

          <div id="researchFields" class="field-grid" hidden>
            <label class="field-box is-textarea" for="researchPromptInput">
              <span>調査プロンプト</span>
              <textarea id="researchPromptInput" rows="4" placeholder="例: 生成AIエージェント市場の最新動向を調査し、日本企業への影響を中心に整理してください。"></textarea>
            </label>
          </div>

          <div class="option-grid">
            <label class="field-box" for="audienceInput">
              <span>対象読者</span>
              <input id="audienceInput" type="text" placeholder="例: 経営層、開発者、営業向け" autocomplete="off">
            </label>
            <label class="field-box" for="pagesInput">
              <span>目標スライド数</span>
              <input id="pagesInput" type="number" min="1" step="1" inputmode="numeric" placeholder="例: 8">
            </label>
            <label class="field-box option-focus" for="focusInput">
              <span>重点テーマ</span>
              <input id="focusInput" type="text" placeholder="例: 日本市場への影響を中心に" autocomplete="off">
            </label>
          </div>

          <div class="generation-actions">
            <button id="generationButton" class="primary-button" type="submit">生成を依頼</button>
          </div>
          <p id="generationMessage" class="form-message" aria-live="polite"></p>
        </form>

        <div class="search-panel">
          <label class="search-box" for="searchInput">
            <span aria-hidden="true">検索</span>
            <input id="searchInput" type="search" placeholder="タイトルで検索" autocomplete="off">
          </label>
          <p id="galleryPageIndicator" class="gallery-page-indicator"></p>
        </div>

        <div id="loadingState" class="status is-visible" role="status" aria-live="polite">
          <div>
            <div class="loader" aria-hidden="true"></div>
            <strong>スライドを読み込んでいます</strong>
            <span>Google Slidesライブラリを準備しています。</span>
          </div>
        </div>

        <div id="errorState" class="status" role="alert"></div>
        <div id="emptyState" class="status"></div>
        <div id="gallery" class="gallery" aria-live="polite"></div>
        <nav id="galleryPager" class="gallery-pager" aria-label="スライド一覧ページ送り" hidden>
          <button id="galleryPrevButton" class="ghost-button" type="button">前へ</button>
          <span id="galleryPagerText"></span>
          <button id="galleryNextButton" class="ghost-button" type="button">次へ</button>
        </nav>
      </div>
    </section>

    <section id="viewerView" class="viewer" aria-labelledby="viewerTitle">
      <div class="shell">
        <header class="viewer-head">
          <button class="ghost-button" type="button" onclick="showGallery()">戻る</button>
          <div class="viewer-title">
            <h2 id="viewerTitle"></h2>
            <p id="pageIndicator"></p>
            <p id="sourceLink" class="source-link"></p>
          </div>
          <button id="fullscreenButton" class="ghost-button" type="button" onclick="toggleViewerFullscreen()">&#20840;&#30011;&#38754;</button>
        </header>

        <div class="viewer-grid">
          <div class="stage-wrap">
            <div class="stage">
              <button id="prevButton" class="nav-button" type="button" onclick="prevPage()" aria-label="Previous page">&lsaquo;</button>
              <div id="slideFrame" class="slide-frame"></div>
              <button id="nextButton" class="nav-button" type="button" onclick="nextPage()" aria-label="Next page">&rsaquo;</button>
            </div>
            <div id="pageStrip" class="page-strip" aria-label="ページサムネイル一覧"></div>
          </div>

          <aside class="viewer-side" aria-label="Speaker notes">
            <h3>Speaker Notes</h3>
            <div id="speakerNoteContent" class="note-content"></div>
          </aside>
        </div>
        <div id="viewerToast" class="viewer-toast" role="status" aria-live="polite" hidden></div>
      </div>
    </section>
  </main>
  <script>
const INITIAL_PAGE_COUNT = 1;
const PREFETCH_PAGE_COUNT = 3;
const GALLERY_PAGE_SIZE = 3;

const state = {
  presentations: [],
  filteredPresentations: [],
  currentPresentation: null,
  currentPageIndex: 0,
  isSlideshowMode: false,
  isReading: false,
  speechRate: 1.0,
  pendingUrls: [],
  pollingTimer: null,
  knownIds: new Set(),
  isRequestingGeneration: false,
  touchStartX: null,
  touchStartY: null,
  pageWindowRequests: {},
  prefetchQueue: {},
  isPrefetching: false,
  generationMode: "url",
  isGenerationPanelOpen: false,
  galleryPageIndex: 0,
  controlsIdleTimer: null,
  toastTimer: null,
  fullscreenRequestId: 0
};

const samplePresentations = [
  createSamplePresentation("product-strategy-2026", "Product Strategy 2026", "https://example.com/product-strategy", "2026-04-29T00:00:00Z", "f7f8fa", "222831", 8),
  createSamplePresentation("design-review", "Design Review: Quiet Interfaces", "https://example.com/design-review", "2026-04-24T09:30:00Z", "f2f0ec", "2f3437", 12),
  createSamplePresentation("market-research", "Market Research Notes", "https://example.com/market-research", "2026-04-20T15:10:00Z", "eef3f0", "24312b", 10),
  createSamplePresentation("quarterly-planning", "Quarterly Planning Deck https://example.com/quarterly-planning", "", "2026-04-12T12:00:00Z", "f5f1f1", "332a2a", 6)
];

function init() {
  bindEvents();
  loadPresentations();
}

function bindEvents() {
  document.getElementById("searchInput").addEventListener("input", function(event) {
    filterPresentations(event.target.value);
  });

  document.getElementById("generationToggle").addEventListener("click", toggleGenerationPanel);

  document.querySelectorAll(".mode-tab").forEach(function(button) {
    button.addEventListener("click", function() {
      setGenerationMode(button.dataset.mode || "url");
    });
  });

  document.getElementById("galleryPrevButton").addEventListener("click", function() {
    changeGalleryPage(-1);
  });

  document.getElementById("galleryNextButton").addEventListener("click", function() {
    changeGalleryPage(1);
  });

  document.getElementById("generationPanel").addEventListener("submit", function(event) {
    event.preventDefault();
    requestGeneration();
  });

  const slideFrame = document.getElementById("slideFrame");
  slideFrame.addEventListener("touchstart", function(event) {
    if (!state.currentPresentation || !event.changedTouches.length) return;
    state.touchStartX = event.changedTouches[0].clientX;
    state.touchStartY = event.changedTouches[0].clientY;
  }, { passive: true });

  slideFrame.addEventListener("touchend", function(event) {
    if (!state.currentPresentation || state.touchStartX === null || !event.changedTouches.length) return;
    const dx = event.changedTouches[0].clientX - state.touchStartX;
    const dy = event.changedTouches[0].clientY - state.touchStartY;
    state.touchStartX = null;
    state.touchStartY = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0) nextPage();
    if (dx > 0) prevPage();
  }, { passive: true });

  const viewer = document.getElementById("viewerView");
  ["click", "touchstart", "mousemove"].forEach(function(eventName) {
    viewer.addEventListener(eventName, wakeViewerControls, { passive: true });
  });

  document.addEventListener("keydown", function(event) {
    if (!state.currentPresentation) return;
    if (event.key === "ArrowRight") nextPage();
    if (event.key === "ArrowLeft") prevPage();
    if (event.key === "Escape") {
      if (isViewerImmersive()) {
        exitViewerFullscreen();
      } else {
        showGallery();
      }
    }
    wakeViewerControls();
  });

  document.addEventListener("fullscreenchange", handleFullscreenChange);
  document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
  document.addEventListener("fullscreenerror", handleFullscreenError);
  document.addEventListener("webkitfullscreenerror", handleFullscreenError);
  window.addEventListener("orientationchange", handleViewportChange);
  window.addEventListener("resize", handleViewportChange);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", handleViewportChange);
  }
}

function loadPresentations() {
  showLoading(true);
  hideError();

  if (isGasRuntime()) {
    google.script.run
      .withSuccessHandler(function(presentations) {
        setPresentations(presentations || []);
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showError(error && error.message ? error.message : String(error));
      })
      .getPresentationsMeta();
    return;
  }

  window.setTimeout(function() {
    setPresentations(samplePresentations);
  }, 350);
}

function setPresentations(presentations) {
  state.presentations = sortPresentations(presentations || []);
  state.filteredPresentations = filterPresentationList(document.getElementById("searchInput").value);
  state.galleryPageIndex = 0;
  state.knownIds = new Set(state.presentations.map(function(presentation) {
    return presentation.id;
  }));
  showLoading(false);
  renderGallery();
}

function renderGallery() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  hideError();

  const items = state.pendingUrls.concat(state.filteredPresentations);
  const pageCount = getGalleryPageCount(items.length);
  state.galleryPageIndex = Math.min(state.galleryPageIndex, Math.max(pageCount - 1, 0));
  const start = state.galleryPageIndex * GALLERY_PAGE_SIZE;
  const visibleItems = items.slice(start, start + GALLERY_PAGE_SIZE);

  visibleItems.forEach(function(item, index) {
    const displayRank = start + index;
    if (typeof item === "string") {
      gallery.appendChild(createPendingCard(item, displayRank));
      return;
    }
    gallery.appendChild(createPresentationCard(item, displayRank));
  });

  if (!state.filteredPresentations.length && !state.pendingUrls.length) {
    showEmpty("表示できるスライドがありません", "検索条件を変えるか、Drive の対象フォルダを確認してください。");
    renderGalleryPager(items.length);
    return;
  }

  hideEmpty();
  renderGalleryPager(items.length);
  hydrateGalleryThumbnails(visibleItems, true);
  warmHiddenPresentationThumbnails(visibleItems);
}

function createPresentationCard(presentation, displayRank) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "slide-card" + (displayRank % GALLERY_PAGE_SIZE === 0 ? " is-featured" : " is-secondary");
  card.onclick = function() {
    openPresentation(presentation.id);
  };

  card.innerHTML =
    '<div class="card-thumb">' +
      imageMarkup(presentation.thumbnailUrl, presentation.title) +
    '</div>' +
    '<div class="card-body">' +
      '<h2 class="card-title">' + escapeHtml(presentation.title) + '</h2>' +
      '<div class="meta">' +
        '<span>' + Number(presentation.pageCount || (presentation.pages || []).length || 0) + '枚</span>' +
        '<span>' + formatDate(presentation.updatedAt) + '</span>' +
      '</div>' +
    '</div>';

  return card;
}

function getGalleryPageCount(total) {
  return Math.max(1, Math.ceil(total / GALLERY_PAGE_SIZE));
}

function renderGalleryPager(total) {
  const pager = document.getElementById("galleryPager");
  const pagerText = document.getElementById("galleryPagerText");
  const indicator = document.getElementById("galleryPageIndicator");
  const pageCount = getGalleryPageCount(total);
  const pageText = total
    ? "Page " + (state.galleryPageIndex + 1) + " / " + pageCount
    : "";

  pager.hidden = total <= GALLERY_PAGE_SIZE;
  pagerText.textContent = pageText;
  indicator.textContent = pageText;
  document.getElementById("galleryPrevButton").disabled = state.galleryPageIndex <= 0;
  document.getElementById("galleryNextButton").disabled = state.galleryPageIndex >= pageCount - 1;
}

function changeGalleryPage(delta) {
  const total = state.pendingUrls.length + state.filteredPresentations.length;
  const pageCount = getGalleryPageCount(total);
  state.galleryPageIndex = Math.max(0, Math.min(state.galleryPageIndex + delta, pageCount - 1));
  renderGallery();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function warmHiddenPresentationThumbnails(visibleItems) {
  if (!isGasRuntime()) return;
  const visibleIds = new Set(visibleItems.filter(function(item) {
    return typeof item !== "string";
  }).map(function(item) {
    return item.id;
  }));
  const missing = state.filteredPresentations.some(function(presentation) {
    return !visibleIds.has(presentation.id) && !presentation.thumbnailUrl;
  });
  if (!missing) return;
  window.setTimeout(function() {
    if (isGasRuntime()) {
      hydrateGalleryThumbnails(
        state.filteredPresentations.filter(function(presentation) {
          return !visibleIds.has(presentation.id) && !presentation.thumbnailUrl;
        }),
        false
      );
    }
  }, 250);
}

function hydrateGalleryThumbnails(items, shouldRender) {
  if (!isGasRuntime()) return;
  const targets = items.filter(function(item) {
    return typeof item !== "string" && item.id && !item.thumbnailUrl && !item.isThumbnailLoading;
  });
  targets.slice(0, shouldRender ? GALLERY_PAGE_SIZE : 6).forEach(function(presentation) {
    presentation.isThumbnailLoading = true;
    google.script.run
      .withSuccessHandler(function(meta) {
        presentation.isThumbnailLoading = false;
        mergeSinglePresentationMeta(meta);
        if (shouldRender) {
          renderGallery();
        } else {
          scheduleRemainingThumbnailHydration();
        }
      })
      .withFailureHandler(function() {
        presentation.isThumbnailLoading = false;
      })
      .getPresentationFirstThumbnail(presentation.id);
  });
}

function scheduleRemainingThumbnailHydration() {
  window.setTimeout(function() {
    hydrateGalleryThumbnails(
      state.filteredPresentations.filter(function(presentation) {
        return !presentation.thumbnailUrl;
      }),
      false
    );
  }, 250);
}

function mergeSinglePresentationMeta(meta) {
  if (!meta || !meta.id) return;
  state.presentations = state.presentations.map(function(item) {
    if (item.id !== meta.id) return item;
    return Object.assign({}, item, meta, { pages: item.pages || meta.pages || [] });
  });
  state.filteredPresentations = filterPresentationList(document.getElementById("searchInput").value);
}

function createPendingCard(label, displayRank) {
  const card = document.createElement("article");
  card.className = "pending-card" + (displayRank % GALLERY_PAGE_SIZE === 0 ? " is-featured" : " is-secondary");
  card.innerHTML =
    '<div class="card-thumb">' +
      '<div class="pending-thumb"><div><div class="loader" aria-hidden="true"></div><strong>生成中...</strong></div></div>' +
    '</div>' +
    '<div class="card-body">' +
      '<h2 class="card-title">' + escapeHtml(label) + '</h2>' +
      '<div class="meta"><span>Slackに依頼済み</span><span>待機中</span></div>' +
    '</div>';
  return card;
}

function openPresentation(presentationId) {
  const presentation = state.presentations.find(function(item) {
    return item.id === presentationId;
  });

  if (!presentation) {
    showError("指定されたスライドが見つかりませんでした。");
    return;
  }

  state.currentPresentation = presentation;
  state.currentPageIndex = 0;
  state.pageWindowRequests = {};
  state.prefetchQueue = {};
  state.isPrefetching = false;
  document.getElementById("galleryView").classList.remove("is-visible");
  document.getElementById("viewerView").classList.add("is-visible");
  ensurePagePlaceholders(presentation);
  renderViewerShell();

  if (isGasRuntime()) {
    renderViewer();
    loadPageWindow(presentationId, 0, INITIAL_PAGE_COUNT, true);
  } else {
    presentation.pages = presentation.localPages || presentation.pages || [];
    renderViewer();
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function ensurePagePlaceholders(presentation) {
  const pageCount = Number(presentation.pageCount || (presentation.pages || []).length || 0);
  if (!presentation.pages || presentation.pages.length !== pageCount || presentation.pages.some(function(page) { return !page; })) {
    const existing = presentation.pages || [];
    presentation.pages = [];
    for (let index = 0; index < pageCount; index += 1) {
      presentation.pages[index] = existing[index] || createPagePlaceholder(index, presentation);
    }
  }
}

function createPagePlaceholder(index, presentation) {
  const isFirstPagePreview = index === 0 && presentation && presentation.thumbnailUrl;
  return {
    pageObjectId: '',
    pageNumber: index + 1,
    imageUrl: isFirstPagePreview ? presentation.thumbnailUrl : '',
    speakerNote: '',
    hasSpeakerNote: false,
    isPreview: Boolean(isFirstPagePreview),
    isLoaded: false
  };
}

function loadPageWindow(presentationId, startIndex, count, isPriority) {
  const presentation = state.currentPresentation;
  if (!presentation || presentation.id !== presentationId) return;

  const pageCount = Number(presentation.pageCount || 0);
  if (!pageCount) return;

  const safeStart = Math.max(0, Math.min(startIndex, pageCount - 1));
  const safeCount = Math.max(1, Math.min(count, pageCount - safeStart));
  const requestKey = presentationId + ':' + safeStart + ':' + safeCount;

  if (state.pageWindowRequests[requestKey]) return;
  if (!hasUnloadedPage(presentation, safeStart, safeCount)) return;

  state.pageWindowRequests[requestKey] = true;

  if (isPriority) {
    showPageLoadingIfCurrentWindow(safeStart, safeCount);
  }

  google.script.run
    .withSuccessHandler(function(result) {
      delete state.pageWindowRequests[requestKey];
      mergePageWindow(presentationId, result);
      if (isPriority) {
        renderViewer();
      }
      queueRemainingPrefetch(presentationId);
    })
    .withFailureHandler(function(error) {
      delete state.pageWindowRequests[requestKey];
      if (isPriority) {
        showViewerError(error && error.message ? error.message : String(error));
      }
    })
    .getPresentationPageWindow(presentationId, safeStart, safeCount);
}

function mergePageWindow(presentationId, result) {
  const presentation = state.currentPresentation && state.currentPresentation.id === presentationId
    ? state.currentPresentation
    : state.presentations.find(function(item) { return item.id === presentationId; });

  if (!presentation || !result) return;

  presentation.pageCount = result.pageCount || presentation.pageCount;
  ensurePagePlaceholders(presentation);

  (result.pages || []).forEach(function(page, offset) {
    const index = Number(result.startIndex || 0) + offset;
    presentation.pages[index] = Object.assign({}, page, { isLoaded: true });
  });

  const stored = state.presentations.find(function(item) {
    return item.id === presentationId;
  });
  if (stored && stored !== presentation) {
    stored.pages = presentation.pages;
  }

  if (state.currentPresentation && state.currentPresentation.id === presentationId) {
    renderViewer();
  }
}

function hasUnloadedPage(presentation, startIndex, count) {
  for (let index = startIndex; index < startIndex + count; index += 1) {
    if (!presentation.pages[index] || !presentation.pages[index].isLoaded) {
      return true;
    }
  }
  return false;
}

function showPageLoadingIfCurrentWindow(startIndex, count) {
  const current = state.currentPageIndex;
  if (current < startIndex || current >= startIndex + count) return;
  showViewerLoading();
}

function queueRemainingPrefetch(presentationId) {
  const presentation = state.currentPresentation;
  if (!presentation || presentation.id !== presentationId || !isGasRuntime()) return;
  const pageCount = Number(presentation.pageCount || 0);

  for (let index = 0; index < pageCount; index += PREFETCH_PAGE_COUNT) {
    if (hasUnloadedPage(presentation, index, PREFETCH_PAGE_COUNT)) {
      state.prefetchQueue[presentationId + ':' + index] = {
        presentationId: presentationId,
        startIndex: index,
        count: PREFETCH_PAGE_COUNT
      };
    }
  }

  runNextPrefetch();
}

function runNextPrefetch() {
  if (state.isPrefetching || !isGasRuntime()) return;
  const keys = Object.keys(state.prefetchQueue);
  if (!keys.length) return;

  const key = keys[0];
  const next = state.prefetchQueue[key];
  delete state.prefetchQueue[key];
  state.isPrefetching = true;

  google.script.run
    .withSuccessHandler(function(result) {
      state.isPrefetching = false;
      mergePageWindow(next.presentationId, result);
      runNextPrefetch();
    })
    .withFailureHandler(function() {
      state.isPrefetching = false;
      runNextPrefetch();
    })
    .getPresentationPageWindow(next.presentationId, next.startIndex, next.count);
}

function renderViewerShell() {
  const presentation = state.currentPresentation;
  if (!presentation) return;
  document.getElementById("viewerTitle").textContent = presentation.title;
  renderSourceLink();
  renderSpeakerNote();
}

function renderViewer() {
  const presentation = state.currentPresentation;
  if (!presentation) return;
  ensurePagePlaceholders(presentation);

  const pages = presentation.pages || [];
  const page = pages[state.currentPageIndex];
  const total = Number(presentation.pageCount || pages.length || 0);

  renderViewerShell();
  document.getElementById("pageIndicator").textContent = total
    ? "Page " + (state.currentPageIndex + 1) + " / " + total
    : "No pages";

  document.getElementById("prevButton").disabled = state.currentPageIndex <= 0;
  document.getElementById("nextButton").disabled = state.currentPageIndex >= total - 1;

  const slideFrame = document.getElementById("slideFrame");
  if (page && (page.isLoaded || page.imageUrl)) {
    slideFrame.innerHTML = imageMarkup(page.imageUrl, presentation.title + " page " + page.pageNumber);
    if (!page.isLoaded && isGasRuntime()) {
      loadPageWindow(presentation.id, state.currentPageIndex, INITIAL_PAGE_COUNT, true);
    }
  } else if (page) {
    slideFrame.innerHTML = '<div class="viewer-message"><div><div class="loader" aria-hidden="true"></div><strong>ページを読み込んでいます</strong><span>このページを優先取得しています。</span></div></div>';
    if (isGasRuntime()) {
      loadPageWindow(presentation.id, state.currentPageIndex, INITIAL_PAGE_COUNT, true);
    }
  } else {
    slideFrame.innerHTML = '<div class="image-fallback">ページ画像がありません</div>';
  }

  renderPageStrip();
  renderSpeakerNote();
}

function showViewerLoading() {
  document.getElementById("pageIndicator").textContent = "ページを読み込んでいます";
  document.getElementById("prevButton").disabled = true;
  document.getElementById("nextButton").disabled = true;
  document.getElementById("slideFrame").innerHTML =
    '<div class="viewer-message"><div><div class="loader" aria-hidden="true"></div><strong>ページを読み込んでいます</strong><span>サムネイルとスピーカーノートを取得中です。</span></div></div>';
  document.getElementById("pageStrip").innerHTML = "";
  renderSpeakerNote("ページ読み込み後に表示します。");
}

function showViewerError(message) {
  document.getElementById("pageIndicator").textContent = "ページ読み込み失敗";
  document.getElementById("slideFrame").innerHTML =
    '<div class="viewer-message is-error"><div><strong>ページを読み込めませんでした</strong><span>' + escapeHtml(message) + '</span></div></div>';
  document.getElementById("pageStrip").innerHTML = "";
  renderSpeakerNote("ページを読み込めなかったため、ノートを表示できません。");
}

function renderPageStrip() {
  const pageStrip = document.getElementById("pageStrip");
  const pages = state.currentPresentation ? state.currentPresentation.pages || [] : [];
  pageStrip.innerHTML = "";

  pages.forEach(function(page, index) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "thumb-button" + (index === state.currentPageIndex ? " is-active" : "");
    button.setAttribute("aria-label", "Page " + page.pageNumber);
    button.onclick = function() {
      goToPage(index);
    };
    button.innerHTML = page.isLoaded || page.imageUrl
      ? imageMarkup(page.imageUrl, "Page " + page.pageNumber)
      : '<div class="image-fallback">Page ' + page.pageNumber + '</div>';
    pageStrip.appendChild(button);
  });
}

function renderSpeakerNote(fallbackMessage) {
  const noteContent = document.getElementById("speakerNoteContent");
  const pages = state.currentPresentation ? state.currentPresentation.pages || [] : [];
  const page = pages[state.currentPageIndex];

  if (fallbackMessage) {
    noteContent.textContent = fallbackMessage;
    return;
  }

  if (page && !page.isLoaded) {
    noteContent.textContent = "このページのスピーカーノートを読み込んでいます。";
    return;
  }

  if (page && page.hasSpeakerNote) {
    noteContent.textContent = page.speakerNote || "";
    return;
  }

  noteContent.textContent = "このページにはスピーカーノートがありません。";
}

function renderSourceLink() {
  const sourceLink = document.getElementById("sourceLink");
  const presentation = state.currentPresentation;
  const url = presentation ? extractFirstUrl(presentation.description) || extractFirstUrl(presentation.title) : "";

  if (!url) {
    sourceLink.innerHTML = "";
    return;
  }

  sourceLink.innerHTML = '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">元記事を開く</a>';
}

function goToPage(index) {
  const presentation = state.currentPresentation;
  const pages = presentation ? presentation.pages || [] : [];
  if (index < 0 || index >= pages.length) return;
  state.currentPageIndex = index;
  renderViewer();
  if (isGasRuntime() && presentation && (!pages[index] || !pages[index].isLoaded)) {
    loadPageWindow(presentation.id, index, INITIAL_PAGE_COUNT, true);
  }
}

function nextPage() {
  goToPage(state.currentPageIndex + 1);
}

function prevPage() {
  goToPage(state.currentPageIndex - 1);
}

function filterPresentations(keyword) {
  state.filteredPresentations = filterPresentationList(keyword);
  state.galleryPageIndex = 0;
  renderGallery();
}

function filterPresentationList(keyword) {
  const query = String(keyword || "").trim().toLowerCase();
  return state.presentations.filter(function(presentation) {
    const haystack = [presentation.title, presentation.description].join(" ").toLowerCase();
    return haystack.indexOf(query) !== -1;
  });
}

function showGallery() {
  exitViewerFullscreen();
  state.currentPresentation = null;
  state.currentPageIndex = 0;
  state.pageWindowRequests = {};
  state.prefetchQueue = {};
  state.isPrefetching = false;
  document.getElementById("viewerView").classList.remove("is-visible");
  document.getElementById("galleryView").classList.add("is-visible");
}

function toggleSlideshow() {
  state.isSlideshowMode = !state.isSlideshowMode;
}

function toggleViewerFullscreen() {
  const viewer = document.getElementById("viewerView");
  const fullscreenElement = getFullscreenElement();

  if (fullscreenElement || isViewerImmersive()) {
    exitViewerFullscreen();
    return;
  }

  state.fullscreenRequestId += 1;
  const requestId = state.fullscreenRequestId;
  document.body.classList.add("viewer-immersive");
  document.body.classList.remove("viewer-fullscreen-unavailable");
  updateViewerViewportHeight();
  syncFullscreenButton();
  wakeViewerControls();
  showOrientationHint();

  const requestFullscreen = viewer.requestFullscreen ||
    viewer.webkitRequestFullscreen ||
    viewer.webkitRequestFullScreen ||
    viewer.msRequestFullscreen;
  if (requestFullscreen) {
    try {
      const result = requestFullscreen.call(viewer, { navigationUI: "hide" });
      if (result && result.catch) {
        result
          .then(function() {
            if (requestId === state.fullscreenRequestId) {
              document.body.classList.add("viewer-native-fullscreen");
              document.body.classList.remove("viewer-fullscreen-unavailable");
              syncFullscreenButton();
            }
          })
          .catch(function() {
            markFullscreenUnavailable();
          });
      } else {
        window.setTimeout(function() {
          if (requestId !== state.fullscreenRequestId) return;
          if (getFullscreenElement()) {
            document.body.classList.add("viewer-native-fullscreen");
            document.body.classList.remove("viewer-fullscreen-unavailable");
          } else {
            markFullscreenUnavailable();
          }
          syncFullscreenButton();
        }, 350);
      }
    } catch (error) {
      markFullscreenUnavailable();
    }
  } else {
    markFullscreenUnavailable();
  }
}

function exitViewerFullscreen() {
  state.fullscreenRequestId += 1;
  clearViewerControlsTimer();
  hideViewerToast();
  document.body.classList.remove("viewer-immersive", "viewer-native-fullscreen", "viewer-fullscreen-unavailable", "viewer-controls-idle", "viewer-fullscreen");

  const fullscreenElement = getFullscreenElement();
  const exitFullscreen = document.exitFullscreen ||
    document.webkitExitFullscreen ||
    document.webkitCancelFullScreen ||
    document.msExitFullscreen;

  if (fullscreenElement && exitFullscreen) {
    try {
      const result = exitFullscreen.call(document);
      if (result && result.catch) {
        result.catch(function() {});
      }
    } catch (error) {}
  }

  syncFullscreenButton();
}

function handleFullscreenChange() {
  const isNativeFullscreen = Boolean(getFullscreenElement());
  document.body.classList.toggle("viewer-native-fullscreen", isNativeFullscreen);
  if (isViewerImmersive() && isNativeFullscreen) {
    document.body.classList.remove("viewer-fullscreen-unavailable");
  }
  if (!isNativeFullscreen && document.body.classList.contains("viewer-native-fullscreen")) {
    document.body.classList.remove("viewer-native-fullscreen");
  }
  updateViewerViewportHeight();
  syncFullscreenButton();
}

function handleFullscreenError() {
  if (isViewerImmersive()) {
    markFullscreenUnavailable();
  }
}

function handleViewportChange() {
  updateViewerViewportHeight();
  showOrientationHint();
}

function updateViewerViewportHeight() {
  const height = window.visualViewport && window.visualViewport.height
    ? window.visualViewport.height
    : window.innerHeight;
  document.documentElement.style.setProperty("--viewer-height", Math.max(1, Math.round(height)) + "px");
}

function getFullscreenElement() {
  return document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.webkitFullScreenElement ||
    document.msFullscreenElement ||
    null;
}

function isViewerImmersive() {
  return document.body.classList.contains("viewer-immersive");
}

function markFullscreenUnavailable() {
  document.body.classList.add("viewer-fullscreen-unavailable");
  document.body.classList.remove("viewer-native-fullscreen");
  showViewerToast("\u30d6\u30e9\u30a6\u30b6\u5236\u7d04\u306b\u3088\u308a\u5b8c\u5168\u5168\u753b\u9762\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u8868\u793a\u9818\u57df\u3092\u6700\u5927\u5316\u3057\u3066\u3044\u307e\u3059\u3002");
  syncFullscreenButton();
}

function showOrientationHint() {
  if (!isViewerImmersive()) return;
  const isPortrait = window.matchMedia && window.matchMedia("(orientation: portrait)").matches;
  if (isPortrait && isCoarsePointer()) {
    showViewerToast("\u6a2a\u5411\u304d\u306b\u3059\u308b\u3068\u3001\u30b9\u30e9\u30a4\u30c9\u3068\u30ce\u30fc\u30c8\u3092\u4e26\u3079\u3066\u898b\u3089\u308c\u307e\u3059\u3002");
  }
}

function isCoarsePointer() {
  return window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
}

function showViewerToast(message) {
  const toast = document.getElementById("viewerToast");
  if (!toast) return;
  toast.textContent = message;
  toast.hidden = false;
  window.clearTimeout(state.toastTimer);
  state.toastTimer = window.setTimeout(function() {
    toast.hidden = true;
  }, 3200);
}

function hideViewerToast() {
  const toast = document.getElementById("viewerToast");
  window.clearTimeout(state.toastTimer);
  if (toast) {
    toast.hidden = true;
  }
}

function wakeViewerControls() {
  if (!isViewerImmersive()) return;
  document.body.classList.remove("viewer-controls-idle");
  clearViewerControlsTimer();
  state.controlsIdleTimer = window.setTimeout(function() {
    if (isViewerImmersive()) {
      document.body.classList.add("viewer-controls-idle");
    }
  }, 2600);
}

function clearViewerControlsTimer() {
  window.clearTimeout(state.controlsIdleTimer);
  state.controlsIdleTimer = null;
}

function syncFullscreenButton() {
  const button = document.getElementById("fullscreenButton");
  if (!button) return;

  const isFullscreen = Boolean(getFullscreenElement()) || isViewerImmersive();
  button.textContent = isFullscreen ? "\u89e3\u9664" : "\u5168\u753b\u9762";
  button.setAttribute("aria-pressed", isFullscreen ? "true" : "false");
}

function toggleGenerationPanel() {
  setGenerationPanelOpen(!state.isGenerationPanelOpen);
}

function setGenerationPanelOpen(isOpen) {
  state.isGenerationPanelOpen = isOpen;
  const panel = document.getElementById("generationPanel");
  const toggle = document.getElementById("generationToggle");
  panel.hidden = !isOpen;
  toggle.textContent = isOpen ? "閉じる" : "スライド生成";
  toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
}

function setGenerationMode(mode) {
  state.generationMode = mode === "research" ? "research" : "url";
  const isResearch = state.generationMode === "research";
  document.getElementById("urlFields").hidden = isResearch;
  document.getElementById("researchFields").hidden = !isResearch;
  document.querySelectorAll(".mode-tab").forEach(function(button) {
    const active = button.dataset.mode === state.generationMode;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-selected", active ? "true" : "false");
  });
  setGenerationMessage("");
}

function requestGeneration() {
  const payloadResult = collectGenerationPayload();

  setGenerationMessage("");
  if (!payloadResult.ok) {
    setGenerationMessage(payloadResult.message, true);
    return;
  }

  const payload = payloadResult.payload;
  const pendingLabel = createPendingLabel(payload);
  setGenerationSubmitting(true);

  if (isGasRuntime()) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.ok) {
          setGenerationSubmitting(false);
          setGenerationMessage("生成依頼の送信に失敗しました。", true);
          return;
        }
        onGenerationRequested(pendingLabel);
      })
      .withFailureHandler(function(error) {
        setGenerationSubmitting(false);
        removePendingCard(pendingLabel);
        setGenerationMessage(error && error.message ? error.message : String(error), true);
      })
      .requestSlideGeneration(payload);
    return;
  }

  window.setTimeout(function() {
    onGenerationRequested(pendingLabel);
    window.setTimeout(function() {
      completeLocalGeneration(pendingLabel);
    }, 2500);
  }, 500);
}

function collectGenerationPayload() {
  const payload = {
    mode: state.generationMode,
    urls: [],
    researchPrompt: "",
    audience: document.getElementById("audienceInput").value.trim(),
    focus: document.getElementById("focusInput").value.trim(),
    pages: document.getElementById("pagesInput").value.trim()
  };

  if (state.generationMode === "research") {
    payload.researchPrompt = document.getElementById("researchPromptInput").value.trim();
    if (!payload.researchPrompt) {
      return { ok: false, message: "調査プロンプトを入力してください。" };
    }
  } else {
    payload.urls = [1, 2, 3].map(function(index) {
      return document.getElementById("urlInput" + index).value.trim();
    }).filter(Boolean);
    if (!payload.urls.length) {
      return { ok: false, message: "URLを1件以上入力してください。" };
    }
    if (payload.urls.length > 3) {
      return { ok: false, message: "URLは最大3件まで指定できます。" };
    }
    if (payload.urls.some(function(url) { return !/^https?:\/\/\S+/i.test(url); })) {
      return { ok: false, message: "URLは http:// または https:// で始まる形式で入力してください。" };
    }
  }

  if (payload.pages && !/^\d+$/.test(payload.pages)) {
    return { ok: false, message: "目標スライド数は整数で入力してください。" };
  }

  return {
    ok: true,
    payload: {
      urls: payload.urls,
      researchPrompt: payload.researchPrompt,
      audience: payload.audience,
      focus: payload.focus,
      pages: payload.pages ? Number(payload.pages) : undefined
    }
  };
}

function createPendingLabel(payload) {
  if (payload.researchPrompt) {
    return "リサーチ: " + payload.researchPrompt;
  }
  return payload.urls.join(", ");
}

function onGenerationRequested(label) {
  setGenerationSubmitting(false);
  setGenerationMessage("生成依頼を送信しました。");
  clearGenerationInputs();
  addPendingCard(label);
  startPolling();
}

function clearGenerationInputs() {
  ["urlInput1", "urlInput2", "urlInput3", "researchPromptInput"].forEach(function(id) {
    const node = document.getElementById(id);
    if (node) node.value = "";
  });
}

function setGenerationSubmitting(isSubmitting) {
  state.isRequestingGeneration = isSubmitting;
  const button = document.getElementById("generationButton");
  button.disabled = isSubmitting;
  button.textContent = isSubmitting ? "送信中..." : "生成を依頼";
}

function setGenerationMessage(message, isError) {
  const messageNode = document.getElementById("generationMessage");
  messageNode.textContent = message || "";
  messageNode.classList.toggle("is-error", Boolean(isError));
}

function addPendingCard(url) {
  if (state.pendingUrls.indexOf(url) === -1) {
    state.pendingUrls.unshift(url);
  }
  state.galleryPageIndex = 0;
  renderGallery();
}

function removePendingCard(url) {
  state.pendingUrls = state.pendingUrls.filter(function(item) {
    return item !== url;
  });
  renderGallery();
  if (!state.pendingUrls.length) {
    stopPolling();
  }
}

function startPolling() {
  if (state.pollingTimer) return;
  state.pollingTimer = window.setInterval(refreshPresentationsMeta, 30000);
}

function stopPolling() {
  if (!state.pollingTimer) return;
  window.clearInterval(state.pollingTimer);
  state.pollingTimer = null;
}

function refreshPresentationsMeta() {
  if (!state.pendingUrls.length) {
    stopPolling();
    return;
  }

  if (isGasRuntime()) {
    google.script.run
      .withSuccessHandler(function(presentations) {
        mergePresentationMeta(presentations || []);
      })
      .withFailureHandler(function(error) {
        setGenerationMessage(error && error.message ? error.message : String(error), true);
      })
      .warmPresentationsCache();
  }
}

function mergePresentationMeta(presentations) {
  const incoming = sortPresentations(presentations);
  const newItems = incoming.filter(function(presentation) {
    return !state.knownIds.has(presentation.id);
  });

  state.presentations = incoming.map(function(meta) {
    const existing = state.presentations.find(function(item) {
      return item.id === meta.id;
    });
    return existing
      ? Object.assign({}, meta, {
          thumbnailUrl: meta.thumbnailUrl || existing.thumbnailUrl || "",
          thumbnailFetchedAt: meta.thumbnailFetchedAt || existing.thumbnailFetchedAt || "",
          pages: existing.pages && existing.pages.length ? existing.pages : meta.pages
        })
      : meta;
  });

  state.knownIds = new Set(state.presentations.map(function(presentation) {
    return presentation.id;
  }));

  newItems.forEach(function(item) {
    const sourceUrl = extractFirstUrl(item.description) || extractFirstUrl(item.title);
    if (sourceUrl && state.pendingUrls.indexOf(sourceUrl) !== -1) {
      state.pendingUrls = state.pendingUrls.filter(function(url) {
        return url !== sourceUrl;
      });
    } else if (state.pendingUrls.length === 1) {
      state.pendingUrls = [];
    }
  });

  state.filteredPresentations = filterPresentationList(document.getElementById("searchInput").value);
  state.galleryPageIndex = 0;
  renderGallery();
  if (!state.pendingUrls.length) {
    stopPolling();
  }
}

function completeLocalGeneration(url) {
  const generated = createSamplePresentation(
    "generated-" + Date.now(),
    "Generated Slides",
    url,
    new Date().toISOString(),
    "edf4f2",
    "1f3d34",
    5
  );
  mergePresentationMeta(state.presentations.concat([generated]));
}

function showLoading(isVisible) {
  document.getElementById("loadingState").classList.toggle("is-visible", isVisible);
}

function showError(message) {
  const errorState = document.getElementById("errorState");
  errorState.innerHTML = '<div><strong>読み込みに失敗しました</strong><span>' + escapeHtml(message) + '</span></div>';
  errorState.classList.add("is-visible");
}

function hideError() {
  document.getElementById("errorState").classList.remove("is-visible");
}

function showEmpty(title, message) {
  const emptyState = document.getElementById("emptyState");
  emptyState.innerHTML = '<div><strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(message) + '</span></div>';
  emptyState.classList.add("is-visible");
}

function hideEmpty() {
  document.getElementById("emptyState").classList.remove("is-visible");
}

function imageMarkup(src, alt) {
  if (!src) return '<div class="image-fallback">画像を表示できません</div>';
  return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '" loading="lazy" onerror="this.replaceWith(createImageFallback())">';
}

function createImageFallback() {
  const fallback = document.createElement("div");
  fallback.className = "image-fallback";
  fallback.textContent = "画像を表示できません";
  return fallback;
}

function createSamplePresentation(id, title, sourceUrl, updatedAt, bg, fg, count) {
  const pages = createSamplePages(title, bg, fg, count);
  return {
    id: id,
    title: title,
    description: sourceUrl ? "Source: " + sourceUrl : "",
    updatedAt: updatedAt,
    updatedAtMillis: String(new Date(updatedAt).getTime()),
    thumbnailUrl: pages.length ? pages[0].imageUrl : "",
    pageCount: pages.length,
    pages: pages,
    localPages: pages
  };
}

function createSamplePages(label, bg, fg, count) {
  const pages = [];
  for (let index = 1; index <= count; index += 1) {
    const hasNote = index % 2 === 1;
    pages.push({
      pageObjectId: "sample-" + label.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + index,
      pageNumber: index,
      imageUrl: createSlideDataUrl(label, index, bg, fg),
      speakerNote: hasNote
        ? "Page " + index + " speaker note.\\nConfirm the key message, then move to the next page."
        : "",
      hasSpeakerNote: hasNote,
      isLoaded: true
    });
  }
  return pages;
}

function createSlideDataUrl(label, pageNumber, bg, fg) {
  const safeLabel = escapeHtml(label);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">' +
    '<rect width="1280" height="720" fill="#' + bg + '"/>' +
    '<rect x="72" y="64" width="1136" height="592" rx="8" fill="#ffffff" opacity="0.74"/>' +
    '<line x1="132" y1="548" x2="1148" y2="548" stroke="#' + fg + '" stroke-opacity="0.16" stroke-width="2"/>' +
    '<text x="132" y="178" fill="#' + fg + '" font-family="Arial, sans-serif" font-size="34" opacity="0.58">Google Slides Viewer</text>' +
    '<text x="132" y="330" fill="#' + fg + '" font-family="Arial, sans-serif" font-size="66" font-weight="700">' + safeLabel + '</text>' +
    '<text x="132" y="420" fill="#' + fg + '" font-family="Arial, sans-serif" font-size="42" opacity="0.7">Page ' + pageNumber + '</text>' +
    '</svg>';
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function sortPresentations(presentations) {
  return (presentations || []).slice().sort(function(a, b) {
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });
}

function extractFirstUrl(value) {
  const match = String(value || "").match(/https?:\/\/[^\s"'<>]+/i);
  return match ? match[0] : "";
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleDateString("ja-JP", {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function isGasRuntime() {
  return Boolean(window.google && google.script && google.script.run);
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", init);
</script>
